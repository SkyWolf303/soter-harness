name: harness-ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # GOLDEN_STALE reads guide history; a shallow clone would silence it
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Prove the Checker itself catches violations (plant-and-assert)…
      - run: node .claude/scripts/check.mjs --selftest
      # …then hold the legacy implementation to its existing hard gate during migration.
      - run: node .claude/scripts/check.mjs --all
      # Prove and run the provider-neutral target verifier during the migration overlap.
      - run: node soter/kernel/verify.mjs --selftest
      - run: node soter/kernel/verify.mjs
      # Prove Core generates contract-valid, effect-free state and that checked-in evidence is current.
      - run: node soter/core/cli.mjs selftest
      - run: node soter/core/cli.mjs fixtures --check
      - run: node soter/core/cli.mjs doctor --lock soter/fixtures/meeting-intake/meeting-intake.lock.json --at 2026-07-15T12:00:00.000Z

  # Plugin invariant: the plugin + marketplace manifest must validate before ship.
  # Separate job so a packaging break is distinct from a content break.
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
