[mcp_servers.soter]
command = "node"
args = ["soter/core/mcp/server.mjs", "--host", "codex"]
enabled = true
required = false
startup_timeout_sec = 10
tool_timeout_sec = 60

[mcp_servers.otter]
url = "https://mcp.otter.ai/mcp"
auth = "oauth"
enabled = true
required = false
default_tools_approval_mode = "writes"
